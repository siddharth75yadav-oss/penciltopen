<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Manka Tuition Center</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --deep: #0f172a;
      --teal: #14b8a6;
      --muted: #4b5563;
      --white: #ffffff;
      --bg: #eef9ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #dff4ff 0%, #edfaff 100%);
      color: var(--deep);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      max-width: 720px;
      width: 100%;
      background: rgba(255,255,255,0.96);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      padding: 3rem 2rem;
      text-align: center;
      border-top: 6px solid var(--teal);
    }

    .check {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--teal));
      color: var(--white);
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 24px rgba(29, 78, 216, 0.2);
    }

    h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 0.8rem; }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto 1.6rem;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .primary {
      background: linear-gradient(135deg, var(--primary), var(--teal));
      color: var(--white);
      box-shadow: 0 12px 22px rgba(29, 78, 216, 0.2);
    }

    .secondary {
      background: var(--white);
      color: var(--deep);
      border: 1px solid rgba(15, 23, 42, 0.12);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Thank You!</h1>
    <p>
      Your enrollment request has been successfully submitted. Our team will contact you shortly
      to confirm your free demo session and guide you through the next steps.
    </p>
    <div class="actions">
      <a class="btn primary" href="manka%20tution.html#Home">Back to Home</a>
      <a class="btn secondary" href="https://wa.me/919810212853" target="_blank">Chat on WhatsApp</a>
    </div>
  </div>
</body>
</html>
